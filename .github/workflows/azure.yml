name: Azure deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target Azure environment
        type: choice
        options: [demo, production]
        default: demo
permissions:
  contents: read
concurrency:
  group: azure-${{ inputs.environment || 'demo' }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          APP_ENVIRONMENT: ${{ inputs.environment || 'demo' }}
          PRODUCTION_ENTRA_TENANT_ID: ${{ vars.PRODUCTION_ENTRA_TENANT_ID }}
      - name: Deploy website and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ""
          skip_app_build: true
          skip_api_build: true
